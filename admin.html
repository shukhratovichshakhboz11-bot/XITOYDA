<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XITOYDAN — Admin Panel</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d0d18;color:#f7f7ff;font:14px Arial}.app{max-width:1000px;margin:auto;padding:22px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-size:24px;font-weight:800}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button,.btn{border:0;border-radius:10px;padding:11px 15px;background:#6535ed;color:#fff;cursor:pointer}.tabs button{background:#24243b}.tabs button.on{background:#6535ed}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.box{background:#19192b;border:1px solid #30304b;border-radius:14px;padding:14px;margin-bottom:10px}.mut{color:#aaa}.input,select,textarea{width:100%;background:#101022;color:#fff;border:1px solid #38385a;border-radius:9px;padding:10px;margin-top:6px}.row{display:flex;gap:9px;align-items:center}.grow{flex:1}.product{display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:center}.product img{width:70px;height:70px;object-fit:cover;border-radius:10px}.danger{background:#c83d4b}.green{background:#168a59}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center}.modal.on{display:flex}.sheet{width:min(600px,100%);max-height:90vh;overflow:auto;background:#18182a;border-radius:20px 20px 0 0;padding:18px}.variant{display:grid;grid-template-columns:1fr 150px auto;gap:7px;margin-top:7px}.status{padding:5px 8px;border-radius:8px;background:#31255e;color:#cfc3ff;font-size:12px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.product{grid-template-columns:55px 1fr}.product img{width:55px;height:55px}.product .actions{grid-column:1/-1}.variant{grid-template-columns:1fr 120px auto}}
</style></head><body><div class="app">
<div class="head"><div><div class="brand">XITOYDAN</div><div class="mut">Admin boshqaruv paneli</div></div><button class="btn" onclick="location.reload()">Yangilash</button></div>
<div class="grid" id="stats"></div><div class="tabs"><button id="t0" class="on" onclick="tab('dashboard')">Sozlamalar</button><button id="t1" onclick="tab('products')">Mahsulotlar</button><button id="t2" onclick="tab('orders')">Buyurtmalar</button><button id="t3" onclick="tab('reviews')">Sharhlar</button></div><div id="area" style="margin-top:14px"></div></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script>
const defaultProducts=[
{id:1,name:"iPhone 15 Pro",price:11990000,old:14990000,cat:"Elektronika",weight:.45,img:"https://images.unsplash.com/photo-1696446701796-da61225697cc?auto=format&fit=crop&w=700&q=80",variants:[{name:"128 GB",price:11990000},{name:"256 GB",price:12990000},{name:"512 GB",price:14500000},{name:"1 TB",price:15900000}],colors:["Titanium Black","Natural Titanium","White Titanium"]},
{id:2,name:"AirPods Pro 2",price:2990000,old:3490000,cat:"Elektronika",weight:.12,img:"https://images.unsplash.com/photo-1606220945770-b5b6c2c55bf1?auto=format&fit=crop&w=700&q=80",variants:[],colors:["White"]},
{id:3,name:"Samsung Galaxy S24",price:8790000,old:9990000,cat:"Elektronika",weight:.4,img:"https://images.unsplash.com/photo-1706343622264-3e0f6a6f1b9b?auto=format&fit=crop&w=700&q=80",variants:[{name:"128 GB",price:8790000},{name:"256 GB",price:9490000}],colors:["Black","Gray"]},
{id:4,name:"Nike krossovka",price:1290000,old:1590000,cat:"Kiyim",weight:.8,img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=700&q=80",variants:[{name:"39",price:1290000},{name:"40",price:1290000},{name:"41",price:1350000},{name:"42",price:1350000}],colors:["Black","White"]}
];
let products=JSON.parse(localStorage.getItem("xtproducts")||"null")||defaultProducts;
let settings=JSON.parse(localStorage.getItem("xtsettings")||'{"autoKg":30000,"airKg":70000,"delivery":30000,"shopAddress":"Toshkent shahri, XITOYDAN do‘koni","shopMap":"https://www.google.com/maps/search/?api=1&query=XITOYDAN+Uzbekistan"}');
let orders=JSON.parse(localStorage.getItem("xtorders")||"[]"), reviews=JSON.parse(localStorage.getItem("xtreviews")||"[]");
const money=n=>Number(n||0).toLocaleString("uz-UZ")+" so‘m";const save=()=>{localStorage.setItem("xtproducts",JSON.stringify(products));localStorage.setItem("xtsettings",JSON.stringify(settings));localStorage.setItem("xtorders",JSON.stringify(orders));localStorage.setItem("xtreviews",JSON.stringify(reviews));};
function stats(){document.getElementById("stats").innerHTML=`<div class="box">Mahsulotlar<br><b>${products.length}</b></div><div class="box">Buyurtmalar<br><b>${orders.length}</b></div><div class="box">Kutilmoqda<br><b>${orders.filter(o=>o.status==="Ko‘rib chiqilmoqda").length}</b></div><div class="box">Sharhlar<br><b>${reviews.length}</b></div>`}
function tab(x){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('on'));document.getElementById('t'+({dashboard:0,products:1,orders:2,reviews:3}[x])).classList.add('on');if(x==='dashboard')dashboard();if(x==='products')productList();if(x==='orders')orderList();if(x==='reviews')reviewList()}
function dashboard(){area.innerHTML=`<div class="box"><h3>Do‘kon va yetkazib berish sozlamalari</h3><label>Avto — so‘m/kg</label><input id="auto" class="input" type="number" value="${settings.autoKg}"><label>Samolyot — so‘m/kg</label><input id="air" class="input" type="number" value="${settings.airKg}"><label>Yetkazib berish — so‘m</label><input id="del" class="input" type="number" value="${settings.delivery}"><label>Do‘kon manzili</label><input id="shop" class="input" value="${settings.shopAddress}"><label>Google Maps havolasi</label><input id="map" class="input" value="${settings.shopMap}"><button class="btn" style="margin-top:10px" onclick="settings.autoKg=+auto.value;settings.airKg=+air.value;settings.delivery=+del.value;settings.shopAddress=shop.value;settings.shopMap=map.value;save();alert('Sozlamalar saqlandi')">Saqlash</button></div><div class="box"><h3>Adminlar</h3><p class="mut">Haqiqiy Telegram admin huquqi backendda tekshirilishi kerak.</p><div class="row"><span class="grow">@shaxbozshuxratovich11</span><b>Asosiy admin</b></div><button class="btn" style="margin-top:10px" onclick="alert('Demo: yangi admin qo‘shish')">+ Admin qo‘shish</button></div>`}
function productList(){area.innerHTML=`<button class="btn" onclick="editProduct()">+ Mahsulot qo‘shish</button><div style="margin-top:12px">${products.map(p=>`<div class="box product"><img src="${p.img}"><div><b>${p.name}</b><div class="mut">${p.cat} · ${p.weight} kg</div><div>${money(p.price)}${p.variants?.length?' dan':''}</div></div><div class="actions"><button class="btn" onclick="editProduct(${p.id})">Tahrirlash</button> <button class="btn danger" onclick="delProduct(${p.id})">O‘chirish</button></div></div>`).join('')}</div>`}
function editProduct(id){let p=id?products.find(x=>x.id===id):{id:Date.now(),name:"",price:0,old:0,cat:"Elektronika",weight:1,img:"",variants:[],colors:[]};let vs=p.variants||[];sheet.innerHTML=`<h3>${id?'Mahsulotni tahrirlash':'Mahsulot qo‘shish'}</h3><input id="pn" class="input" placeholder="Nomi" value="${p.name}"><input id="pp" class="input" type="number" placeholder="Asosiy narx" value="${p.price}"><input id="po" class="input" type="number" placeholder="Eski narx" value="${p.old||0}"><input id="pw" class="input" type="number" step=".01" placeholder="Og‘irligi kg" value="${p.weight}"><input id="pc" class="input" placeholder="Kategoriya" value="${p.cat}"><input id="pi" class="input" placeholder="Rasm URL" value="${p.img}"><input id="pcol" class="input" placeholder="Ranglar: Qora,Oq" value="${(p.colors||[]).join(',')}"><h4>Variantlar va alohida narxlar</h4><div id="vs">${vs.map((v,i)=>vrow(i,v)).join('')}</div><button class="btn" onclick="addV()">+ Variant</button><div class="row" style="margin-top:12px"><button class="btn grow" onclick="saveP(${id||0})">Saqlash</button><button class="btn danger" onclick="closeM()">Bekor qilish</button></div>`;modal.classList.add('on')}
function vrow(i,v={name:"",price:0}){return `<div class="variant" id="v${i}"><input class="input vn" value="${v.name}" placeholder="Masalan 256 GB"><input class="input vp" type="number" value="${v.price}" placeholder="Narx"><button class="btn danger" onclick="this.parentElement.remove()">×</button></div>`}
function addV(){let i=document.querySelectorAll('.variant').length;vs.insertAdjacentHTML('beforeend',vrow(i))}
function saveP(id){let p=id?products.find(x=>x.id===id):{id:Date.now()};p.name=pn.value;p.price=+pp.value;p.old=+po.value;p.weight=+pw.value;p.cat=pc.value;p.img=pi.value;p.colors=pcol.value.split(',').map(x=>x.trim()).filter(Boolean);p.variants=[...document.querySelectorAll('.variant')].map(r=>({name:r.querySelector('.vn').value,price:+r.querySelector('.vp').value})).filter(v=>v.name);if(!id)products.push(p);save();closeM();productList();stats()}
function delProduct(id){if(confirm('Mahsulot o‘chirilsinmi?')){products=products.filter(p=>p.id!==id);save();productList();stats()}}
function orderList(){area.innerHTML=orders.length?orders.map(o=>`<div class="box"><div class="row"><b>#${o.id}</b><span class="grow"></span><span class="status">${o.status}</span></div><p class="mut">${products.find(p=>p.id===o.product)?.name||'Mahsulot'} · ${money(o.total)} · ${o.kg?.toFixed?.(2)||0} kg</p><select class="input" onchange="status(${o.id},this.value)"><option ${o.status==='Ko‘rib chiqilmoqda'?'selected':''}>Ko‘rib chiqilmoqda</option><option ${o.status==='Tasdiqlandi'?'selected':''}>Tasdiqlandi</option><option ${o.status==='Xitoy omborida'?'selected':''}>Xitoy omborida</option><option ${o.status==='UZBga yuborilmoqda'?'selected':''}>UZBga yuborilmoqda</option><option ${o.status==='Do‘konga keldi'?'selected':''}>Do‘konga keldi</option><option ${o.status==='Yetkazib berildi'?'selected':''}>Yetkazib berildi</option><option ${o.status==='Bekor qilindi'?'selected':''}>Bekor qilindi</option></select><input id="tr${o.id}" class="input" value="${o.tracking||''}" placeholder="Trek kodi"><input id="cu${o.id}" class="input" value="${o.courier||''}" placeholder="Kuryer raqami"><button class="btn" style="margin-top:8px" onclick="orderSave(${o.id})">Saqlash</button></div>`).join(''):'<div class="box">Buyurtmalar yo‘q.</div>'}
function status(id,s){let o=orders.find(x=>x.id===id);o.status=s;save();orderList();stats()}
function orderSave(id){let o=orders.find(x=>x.id===id);o.tracking=document.getElementById('tr'+id).value;o.courier=document.getElementById('cu'+id).value;save();alert('Buyurtma saqlandi')}
function reviewList(){area.innerHTML=reviews.length?reviews.map(r=>`<div class="box"><b>${r.name||'Mijoz'} · ${'★'.repeat(r.rating||5)}</b><p>${r.text||''}</p>${r.photo?`<img src="${r.photo}" style="max-width:220px;border-radius:10px">`:''}<div class="mut">Buyurtma #${r.order}</div></div>`).join(''):'<div class="box">Hozircha sharh yo‘q.</div>'}
function closeM(){modal.classList.remove('on')}modal.onclick=e=>{if(e.target===modal)closeM()};stats();dashboard();
</script></body></html>
